<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المتجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <style>
        :root { --primary: #0f172a; --accent: #4f46e5; --bg: #f8fafc; --text: #1e293b; --card: #ffffff;}
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        /* شاشة تسجيل الدخول للمدير */
        #loginScreen { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--primary); }
        .login-box { background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { margin-top: 0; color: var(--primary); font-weight: 900; margin-bottom: 20px;}
        .login-box input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: inherit; font-size: 1em; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 900; font-size: 1.1em; cursor: pointer; font-family: inherit; }
        
        /* هيكل لوحة التحكم */
        #dashboardScreen { display: none; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--primary); color: white; position: fixed; top: 0; right: 0; height: 100vh; padding: 20px 0; }
        .sidebar-brand { text-align: center; font-size: 1.5em; font-weight: 900; margin-bottom: 40px; padding: 0 20px; color: #fff;}
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li a { display: block; padding: 15px 25px; color: #94a3b8; text-decoration: none; font-weight: 700; transition: 0.3s; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: rgba(255,255,255,0.1); color: white; border-right: 4px solid var(--accent); }
        
        .main-content { margin-right: 260px; padding: 30px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px;}
        .topbar button { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 700;}
        
        /* مساحات العمل */
        .workspace { display: none; background: var(--card); padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .workspace.active { display: block; }
    </style>
</head>
<body>

    <!-- واجهة الدخول -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>لوحة تحكم المتجر (الإدارة)</h2>
            <input type="email" id="adminEmail" placeholder="البريد الإلكتروني للإدارة" />
            <input type="password" id="adminPassword" placeholder="كلمة المرور" />
            <button onclick="loginAdmin()" id="loginBtn">تسجيل الدخول</button>
            <p id="errorMsg" style="color: red; margin-top: 15px; display: none; font-weight: 700;"></p>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboardScreen">
        <aside class="sidebar">
            <div class="sidebar-brand">لوحة الإدارة</div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active" onclick="switchTab('orders')"><i class="fa-solid fa-cart-shopping"></i> إدارة الطلبات</a></li>
                <li><a href="#" onclick="switchTab('products')"><i class="fa-solid fa-box-open"></i> إضافة منتج جديد</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h3 style="margin: 0;" id="pageTitle">إدارة الطلبات</h3>
                <button onclick="logoutAdmin()">تسجيل الخروج</button>
            </div>

            <!-- قسم الطلبات -->
            <div id="orders" class="workspace active">
                <h2>الطلبات الواردة</h2>
                <p style="color: #64748b;">(سيتم برمجة جلب الطلبات من فايربيس وعرضها كجدول هنا في الخطوة القادمة)</p>
            </div>

            <!-- قسم المنتجات -->
            <div id="products" class="workspace">
                <h2>إضافة منتج لمتجر بلوجر</h2>
                <p style="color: #64748b;">(سيتم برمجة نموذج إدخال المنتجات المربوط بـ Blogger API هنا)</p>
            </div>
        </main>
    </div>

    <!-- أكواد فايربيس -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2HVxQZrr1sK7zO5VAjPlC7D26GeM8j8E", // ضع كود مشروعك هنا
            authDomain: "database-86f3d.firebaseapp.com",
            projectId: "database-86f3d",
            storageBucket: "database-86f3d.firebasestorage.app",
            messagingSenderId: "269974939223",
            appId: "1:269974939223:web:81a5c4b300f56cc871a512"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // **ضع إيميلك الخاص هنا لحماية اللوحة**
        const ADMIN_EMAIL = "abanoub.galaxy@gmail.com"; 

        // تبديل القوائم
        window.switchTab = function(tabId) {
            document.querySelectorAll('.workspace').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-menu a').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            document.getElementById('pageTitle').innerText = tabId === 'orders' ? 'إدارة الطلبات' : 'إضافة منتج جديد';
        };

        // مراقب حالة الأدمن
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('dashboardScreen').style.display = 'none';
                if(user) signOut(auth); // طرد أي مستخدم عادي يحاول الدخول
            }
        });

        // تسجيل الدخول
        window.loginAdmin = async function() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (email !== ADMIN_EMAIL) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "ليس لديك صلاحية للدخول كمدير.";
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "بيانات الدخول غير صحيحة!";
            }
        };

        window.logoutAdmin = () => signOut(auth);
    </script>
</body>
</html>
